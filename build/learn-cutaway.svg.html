<svg id="cut" class="cut" viewBox="24 44 926 510" role="img" aria-labelledby="cut-t">
  <title id="cut-t">Side x-ray of a stock Rancilio Silvia: tank at the back, pump below it with its one-way valve, the overpressure valve, the boiler above the group with its element inside, the safety thermostat on its front, the 3-way valve beside the group with its plunger, coil and drain tube, and the steam valve and wand at the front</title>
  <defs>
    <pattern id="cut-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" class="dot"/></pattern>
    <linearGradient id="cut-brass" x1="0" x2="1"><stop offset="0" stop-color="#9C7A36"/><stop offset=".4" stop-color="#E2C27C"/><stop offset=".7" stop-color="#C39A4E"/><stop offset="1" stop-color="#8E6C2C"/></linearGradient>
    <linearGradient id="cut-chrome" x1="0" x2="1"><stop offset="0" stop-color="#7C848B"/><stop offset=".35" stop-color="#EEF1F3"/><stop offset=".65" stop-color="#B4BBC1"/><stop offset="1" stop-color="#737B82"/></linearGradient>
    <radialGradient id="cut-glow" cx="50%" cy="72%" r="70%"><stop offset="0" stop-color="#FF9A3C" stop-opacity=".95"/><stop offset=".6" stop-color="#F27A1A" stop-opacity=".35"/><stop offset="1" stop-color="#F27A1A" stop-opacity="0"/></radialGradient>
    <clipPath id="cut-bclip"><rect x="238" y="160" width="174" height="162" rx="16"/></clipPath>
    <clipPath id="cut-cupclip"><path d="M300,452 H352 L348,512 H304 Z"/></clipPath>
    <clipPath id="cut-jugclip"><path d="M38,396 H84 L80,452 H42 Z"/></clipPath>
  </defs>
  <rect width="960" height="600" fill="url(#cut-dots)"/>

  <!-- shell -->
  <rect x="160" y="70" width="640" height="460" rx="14" class="shell"/>
  <rect x="160" y="56" width="640" height="14" rx="4" class="shell-top"/>
  <rect x="182" y="530" width="44" height="10" rx="2" class="foot"/><rect x="734" y="530" width="44" height="10" rx="2" class="foot"/>
  <text x="790" y="84" class="lbl" text-anchor="end">back</text><text x="170" y="84" class="lbl">front</text>

  <!-- tank -->
  <g id="p-tank" class="part">
    <rect x="560" y="92" width="220" height="230" rx="10" class="tank"/>
    <path d="M562,146 H778 V312 Q778,320 770,320 H570 Q562,320 562,312 Z" class="tankwater"/>
    <path d="M566,146 H774" class="wave"/>
  </g>

  <!-- pipes: each is a tube (wall) with a bore whose fill shows what's in it.
       The boiler-to-valve pipe runs behind the valve-to-group pipe; the halo makes the crossing read. -->
  <g class="pipes">
    <path class="tw" d="M736,320 V400"/><path class="tb" data-b="intake" d="M736,320 V400"/>
    <path class="tw" d="M560,426 H556"/><path class="tb" data-b="pumpout" d="M560,426 H556"/>
    <path class="tw" d="M538,396 V114 Q538,102 550,102 H596 V146"/><path class="tb" data-b="opvret" d="M538,396 V114 Q538,102 550,102 H596 V146"/>
    <path class="tw" d="M520,426 H518 Q506,426 506,414 V226 Q506,214 494,214 H420"/><path class="tb" data-b="boilerin" d="M520,426 H518 Q506,426 506,414 V226 Q506,214 494,214 H420"/>
    <path class="tw" d="M398,326 V386 Q398,396 408,396 H442 Q452,396 452,386 V380"/><path class="tb" data-b="valvein" d="M398,326 V386 Q398,396 408,396 H442 Q452,396 452,386 V380"/>
    <path class="halo" d="M428,364 H388"/>
    <path class="tw" d="M428,364 H388"/><path class="tb" data-b="valveout" d="M428,364 H388"/>
    <path class="tw" d="M452,296 V288 Q452,278 462,278 H478 Q488,278 488,288 V504"/><path class="tb" data-b="drain" d="M452,296 V288 Q452,278 462,278 H478 Q488,278 488,288 V504"/>
    <path class="tw" d="M398,152 V116 Q398,104 386,104 H150 Q138,104 138,116 V150"/><path class="tb" data-b="steam" d="M398,152 V116 Q398,104 386,104 H150 Q138,104 138,116 V150"/>
  </g>

  <!-- pump, with its one-way valve at the outlet end -->
  <g id="p-pump" class="part">
    <g class="pumpbody">
      <rect x="560" y="404" width="190" height="44" rx="20" class="pump"/>
      <path d="M572,426 H738" class="pbore"/>
      <rect x="600" y="400" width="80" height="52" rx="6" class="coil"/>
      <g class="windings"><line x1="612" y1="402" x2="612" y2="450"/><line x1="624" y1="402" x2="624" y2="450"/><line x1="636" y1="402" x2="636" y2="450"/><line x1="648" y1="402" x2="648" y2="450"/><line x1="660" y1="402" x2="660" y2="450"/><line x1="672" y1="402" x2="672" y2="450"/></g>
      <path d="M588,416 V421.5 M588,430.5 V436" class="seat"/>
      <circle id="chk" cx="583" cy="426" r="4.6" class="ball"/>
    </g>
    <rect x="726" y="398" width="20" height="8" rx="2" class="nipple"/>
  </g>

  <!-- OPV: a T on the pump line. Its spring holds a plug shut until the pressure beats it. -->
  <g id="p-opv" class="part">
    <rect x="520" y="410" width="36" height="34" rx="5" fill="url(#cut-brass)" class="brass-s"/>
    <rect x="528" y="396" width="20" height="16" rx="3" fill="url(#cut-brass)" class="brass-s"/>
    <path d="M531,400 h14 M531,404 h14 M531,408 h14" class="spring"/>
    <rect id="opvplug" x="532" y="412" width="12" height="6" rx="1.5" class="plug"/>
  </g>

  <!-- boiler and element -->
  <g id="p-boiler" class="part">
    <rect x="230" y="150" width="190" height="180" rx="22" fill="url(#cut-brass)" class="brass-s"/>
    <rect x="238" y="160" width="174" height="162" rx="16" class="boilerin"/>
    <g clip-path="url(#cut-bclip)">
      <rect id="bwater" x="238" y="160" width="174" height="162" class="boilerwater"/>
      <rect id="bpres" x="238" y="160" width="174" height="162" class="bpres"/>
      <path id="bsurf" d="M238,160 H412" class="bsurf"/>
    </g>
    <rect id="heatglow" x="230" y="150" width="190" height="180" rx="22" fill="url(#cut-glow)" opacity="0"/>
  </g>
  <g id="p-element" class="part">
    <path id="element" d="M246,290 l12,-18 l12,18 l12,-18 l12,18 l12,-18 l12,18 l12,-18 l12,18 l12,-18 l12,18 l12,-18 l12,18 l12,-18 l10,14" class="element"/>
  </g>
  <g id="p-tstat" class="part">
    <g class="tst"><rect x="248" y="134" width="32" height="16" rx="3"/><text x="264" y="128" class="mini" text-anchor="middle">brew</text></g>
    <g class="tst"><rect x="292" y="134" width="32" height="16" rx="3"/><text x="308" y="128" class="mini" text-anchor="middle">steam</text></g>
    <g class="tst safety"><rect x="214" y="244" width="16" height="30" rx="3"/><circle cx="210" cy="259" r="4"/><text x="226" y="292" class="mini" text-anchor="end">safety</text></g>
  </g>

  <!-- group, portafilter with a puck, cup -->
  <g id="p-group" class="part">
    <path d="M262,330 H388 V366 Q388,372 382,372 H268 Q262,372 262,366 Z" fill="url(#cut-chrome)" class="chrome-s"/>
    <rect x="272" y="360" width="116" height="8" rx="3" class="gchan" data-b="group"/>
    <line x1="270" y1="372" x2="380" y2="372" class="screen"/>
  </g>
  <g id="p-pf" class="part">
    <path d="M268,376 H382 L374,400 H276 Z" fill="url(#cut-chrome)" class="chrome-s"/>
    <path d="M280,378 H370 L366,392 H284 Z" class="puck"/>
    <path d="M270,384 L84,394 Q76,395 76,402 Q76,409 84,409 L272,398 Z" class="handle"/>
    <rect x="308" y="400" width="10" height="10" rx="2" class="spout"/><rect x="334" y="400" width="10" height="10" rx="2" class="spout"/>
  </g>
  <g id="p-tray" class="part">
    <rect x="118" y="512" width="390" height="18" rx="4" class="tray"/>
    <path d="M136,518 h354 M136,524 h354" class="grate"/>
    <rect id="cupfill" x="300" y="512" width="52" height="0" class="cupfill" clip-path="url(#cut-cupclip)"/>
    <path d="M300,452 H352 L348,512 H304 Z" class="cup"/>
  </g>

  <!-- 3-way valve, x-ray: brass body with a chamber, an iron plunger, the coil above with the drain through its core.
       Off, the spring holds the plunger down on the boiler seat and the group is open to the drain.
       On, the coil lifts it onto the drain seat and the boiler feeds the group. -->
  <g id="p-sol" class="part">
    <rect x="434" y="296" width="36" height="40" rx="4" class="solcoil"/>
    <line x1="438" y1="304" x2="466" y2="304" class="wind2"/><line x1="438" y1="312" x2="466" y2="312" class="wind2"/><line x1="438" y1="320" x2="466" y2="320" class="wind2"/><line x1="438" y1="328" x2="466" y2="328" class="wind2"/>
    <path d="M452,297 V336" class="core" data-b="core"/>
    <rect x="428" y="336" width="48" height="44" rx="5" fill="url(#cut-brass)" class="brass-s"/>
    <rect x="438" y="342" width="28" height="32" rx="3" class="chamber" data-b="chamber"/>
    <path d="M428,364 H438" class="port" data-b="chamber"/>
    <path d="M452,336 V342" class="core" data-b="core"/>
    <path d="M452,374 V380" class="port" data-b="valvein"/>
    <path d="M444,342 H448 M456,342 H460 M444,374 H448 M456,374 H460" class="lip"/>
    <g id="plunger"><rect x="444" y="358" width="16" height="16" rx="2" class="plg"/><rect x="446" y="358" width="12" height="2.6" rx="1" class="pad"/><rect x="446" y="371.4" width="12" height="2.6" rx="1" class="pad"/></g>
    <text x="434" y="412" class="mini">boiler</text>
    <text x="482" y="470" class="mini" text-anchor="end">drain</text>
  </g>

  <!-- steam valve and wand -->
  <g id="p-wand" class="part">
    <rect x="124" y="150" width="28" height="36" rx="5" fill="url(#cut-chrome)" class="chrome-s"/>
    <path d="M138,150 V186" class="vbore" data-b="steam"/>
    <rect id="sgate" x="133" y="163" width="10" height="9" rx="2" class="gate"/>
    <g id="knob"><rect x="96" y="156" width="28" height="24" rx="6" class="knob"/><line x1="104" y1="168" x2="118" y2="168" class="knobmark"/></g>
    <path id="wand" d="M138,186 V198 Q138,212 124,218 L72,244 Q60,250 60,264 V380" class="wand"/>
    <g id="jugg"><rect id="jugfill" x="38" y="452" width="46" height="0" class="jugfill" clip-path="url(#cut-jugclip)"/>
    <path id="jug" d="M38,396 H84 L80,452 H42 Z" class="jug"/></g>
  </g>

  <!-- front panel and inlet -->
  <g id="p-panel" class="part">
    <rect x="164" y="96" width="34" height="132" rx="6" class="panel"/>
    <rect x="170" y="104" width="22" height="22" rx="4" class="sw" id="sw-pwr"/>
    <rect x="170" y="134" width="22" height="22" rx="4" class="sw" id="sw-brew"/>
    <rect x="170" y="164" width="22" height="22" rx="4" class="sw" id="sw-water"/>
    <rect x="170" y="194" width="22" height="22" rx="4" class="sw" id="sw-steam"/>
  </g>
  <g id="p-inlet" class="part">
    <rect x="796" y="462" width="22" height="40" rx="4" class="inlet"/>
    <path d="M818,482 C860,482 880,520 940,520" class="cord"/>
  </g>

  <!-- paths the water, coffee and steam move along; drawn by the script as moving dots -->
  <g class="routes" aria-hidden="true">
    <path data-r="intake" d="M736,322 V404"/>
    <path data-r="pump" d="M736,426 H560"/>
    <path data-r="tee" d="M560,426 H538"/>
    <path data-r="opvret" d="M538,412 V114 Q538,102 550,102 H596 V150"/>
    <path data-r="boilerin" d="M538,426 H518 Q506,426 506,414 V226 Q506,214 494,214 H420"/>
    <path data-r="bmix" d="M420,214 C352,214 318,292 360,312 C378,320 392,322 398,328"/>
    <path data-r="bup" d="M420,214 C406,214 398,206 398,192 V152"/>
    <path data-r="valvein" d="M398,328 V386 Q398,396 408,396 H442 Q452,396 452,386 V374"/>
    <path data-r="through" d="M452,374 V368 Q452,364 446,364 H388"/>
    <path data-r="screen" d="M388,364 H276"/>
    <path data-r="rain1" d="M290,368 V382"/><path data-r="rain2" d="M314,368 V382"/><path data-r="rain3" d="M338,368 V382"/><path data-r="rain4" d="M362,368 V382"/>
    <path data-r="shot1" d="M313,410 V512"/><path data-r="shot2" d="M339,410 V512"/>
    <path data-r="vent" d="M330,364 H441 V352 Q441,346 446,345 Q452,344 452,338 V288 Q452,278 462,278 H478 Q488,278 488,288 V508"/>
    <path data-r="steam" d="M398,152 V116 Q398,104 386,104 H150 Q138,104 138,116 V198 Q138,212 124,218 L72,244 Q60,250 60,264 V384"/>
    <path data-r="hot" d="M398,152 V116 Q398,104 386,104 H150 Q138,104 138,116 V198 Q138,212 124,218 L72,244 Q60,250 60,264 V452"/>
  </g>
  <g id="dots" class="dots" aria-hidden="true"></g>
  <g id="puffs" class="puffs"><circle cx="60" cy="392" r="7"/><circle cx="66" cy="404" r="9"/><circle cx="54" cy="416" r="8"/></g>

  <!-- hotspots -->
  <g class="hots">
    <g class="hot" data-part="tank" tabindex="0" role="button" aria-label="Water tank"><circle cx="670" cy="220" r="18"/><text x="670" y="225">1</text></g>
    <g class="hot" data-part="pump" tabindex="0" role="button" aria-label="Vibratory pump"><circle cx="704" cy="476" r="18"/><text x="704" y="481">2</text></g>
    <g class="hot" data-part="opv" tabindex="0" role="button" aria-label="Overpressure valve"><circle cx="538" cy="476" r="18"/><text x="538" y="481">3</text></g>
    <g class="hot" data-part="boiler" tabindex="0" role="button" aria-label="Boiler"><circle cx="300" cy="212" r="18"/><text x="300" y="217">4</text></g>
    <g class="hot" data-part="element" tabindex="0" role="button" aria-label="Heating element"><circle cx="372" cy="281" r="18"/><text x="372" y="286">5</text></g>
    <g class="hot" data-part="tstat" tabindex="0" role="button" aria-label="Thermostats"><circle cx="348" cy="128" r="18"/><text x="348" y="133">6</text></g>
    <g class="hot" data-part="sol" tabindex="0" role="button" aria-label="3-way solenoid valve"><circle cx="424" cy="440" r="18"/><text x="424" y="445">7</text></g>
    <g class="hot" data-part="group" tabindex="0" role="button" aria-label="Group head"><circle cx="234" cy="350" r="18"/><text x="234" y="355">8</text></g>
    <g class="hot" data-part="pf" tabindex="0" role="button" aria-label="Portafilter"><circle cx="160" cy="424" r="18"/><text x="160" y="429">9</text></g>
    <g class="hot" data-part="wand" tabindex="0" role="button" aria-label="Steam valve and wand"><circle cx="100" cy="300" r="18"/><text x="100" y="305">10</text></g>
    <g class="hot" data-part="tray" tabindex="0" role="button" aria-label="Drip tray"><circle cx="230" cy="500" r="18"/><text x="230" y="505">11</text></g>
    <g class="hot" data-part="panel" tabindex="0" role="button" aria-label="Switches"><circle cx="218" cy="146" r="18"/><text x="218" y="151">12</text></g>
    <g class="hot" data-part="inlet" tabindex="0" role="button" aria-label="Power inlet"><circle cx="840" cy="440" r="18"/><text x="840" y="445">13</text></g>
  </g>
</svg>
