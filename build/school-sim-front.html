  <!-- Barista school: the Silvia from the front, forked from learn-sim.html (Run the machine); school-sim.js runs it -->
      <svg id="sim-front" class="simf" viewBox="0 -22 560 492" role="group" aria-label="The machine from the front">
        <defs>
          <linearGradient id="sf-steel" x1="0" x2="1"><stop offset="0" stop-color="#8F989F"/><stop offset=".22" stop-color="#E4E8EB"/><stop offset=".5" stop-color="#C6CDD2"/><stop offset=".78" stop-color="#E9ECEE"/><stop offset="1" stop-color="#868F96"/></linearGradient>
          <linearGradient id="sf-steelh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF1F3"/><stop offset=".6" stop-color="#C3CAD0"/><stop offset="1" stop-color="#959EA5"/></linearGradient>
          <linearGradient id="sf-rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3F44"/><stop offset="1" stop-color="#15181B"/></linearGradient>
          <linearGradient id="sf-rockp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1012"/><stop offset="1" stop-color="#26292D"/></linearGradient>
          <linearGradient id="sf-rocklit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB24A"/><stop offset="1" stop-color="#D96A12"/></linearGradient>
          <linearGradient id="sf-rocklitp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A4A0E"/><stop offset="1" stop-color="#C9661A"/></linearGradient>
          <linearGradient id="sf-recess" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B636A"/><stop offset=".18" stop-color="#9BA3AA"/><stop offset="1" stop-color="#B9C0C6"/></linearGradient>
          <radialGradient id="sf-orange"><stop offset="0" stop-color="#FFE7B0"/><stop offset=".45" stop-color="#FF9A2E"/><stop offset="1" stop-color="#E2541A"/></radialGradient>
          <radialGradient id="sf-green"><stop offset="0" stop-color="#E4FFE9"/><stop offset=".45" stop-color="#4FE07A"/><stop offset="1" stop-color="#1D9A45"/></radialGradient>
          <pattern id="sf-brush" width="5" height="60" patternUnits="userSpaceOnUse"><line x1="1" y1="0" x2="1" y2="60" stroke="#FFFFFF" stroke-opacity=".16"/><line x1="3.5" y1="0" x2="3.5" y2="60" stroke="#000000" stroke-opacity=".04"/></pattern>
          <pattern id="sf-grate" width="7" height="9" patternUnits="userSpaceOnUse"><rect width="7" height="9" fill="#C9CFD4"/><rect x="1.5" y="2" width="4" height="5" rx="1.5" fill="#3B4045"/></pattern>
          <filter id="sf-glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/></filter>
        </defs>
        <rect class="counter" x="0" y="448" width="560" height="24"/>

        <!-- a plain wall clock: the time going by -->
        <g class="clock" transform="translate(62 72)">
          <circle r="40" class="clk-rim"/><circle r="35" class="clk-face"/>
          <g class="clk-ticks"><line y1="-33" y2="-27"/><line y1="-33" y2="-27" transform="rotate(30)"/><line y1="-33" y2="-27" transform="rotate(60)"/><line y1="-33" y2="-27" transform="rotate(90)"/><line y1="-33" y2="-27" transform="rotate(120)"/><line y1="-33" y2="-27" transform="rotate(150)"/><line y1="-33" y2="-27" transform="rotate(180)"/><line y1="-33" y2="-27" transform="rotate(210)"/><line y1="-33" y2="-27" transform="rotate(240)"/><line y1="-33" y2="-27" transform="rotate(270)"/><line y1="-33" y2="-27" transform="rotate(300)"/><line y1="-33" y2="-27" transform="rotate(330)"/></g>
          <line id="f-hhr" class="clk-hr" y1="4" y2="-17"/><line id="f-hmin" class="clk-min" y1="5" y2="-26"/><line id="f-hsec" class="clk-sec" y1="8" y2="-30"/><circle r="2.6" class="clk-cap"/>
        </g>

        <!-- body: a tall steel box with a railed cup tray on top -->
        <rect x="150" y="430" width="34" height="18" rx="3" class="foot"/><rect x="376" y="430" width="34" height="18" rx="3" class="foot"/>
        <path d="M122,28 V14 H438 V28" class="rail"/>
        <rect x="116" y="26" width="328" height="18" rx="4" fill="url(#sf-steelh)" class="edge"/>
        <rect x="120" y="42" width="320" height="354" rx="8" fill="url(#sf-steel)" class="edge"/>
        <rect x="120" y="42" width="320" height="354" rx="8" fill="url(#sf-brush)"/>
        <rect x="432" y="46" width="8" height="346" fill="#000" opacity=".14"/>
        <rect x="156" y="236" width="248" height="160" rx="6" fill="url(#sf-recess)" class="recess"/>

        <!-- brew, hot water and steam rockers stacked on the left; each lights orange when it's on -->
        <g id="f-sw-brew" class="rock lit-rk" role="button" tabindex="0" aria-pressed="false" aria-label="Brew switch" transform="translate(162 94)">
          <rect x="-16" y="-23" width="32" height="46" rx="5" class="bezel"/>
          <rect x="-13" y="-20" width="26" height="20" rx="3" class="rk-top"/><rect x="-13" y="0" width="26" height="20" rx="3" class="rk-bot"/>
          <path d="M-6,-14 H4 V-10 Q4,-6 0,-6 H-2 Q-6,-6 -6,-10 Z M4,-12.5 Q7.5,-12.5 7.5,-10.5 Q7.5,-8.5 4,-8.5 M-8,-3.5 H6" class="ico"/>
        </g>
        <g id="f-sw-water" class="rock lit-rk" role="button" tabindex="0" aria-pressed="false" aria-label="Hot water switch" transform="translate(162 144)">
          <rect x="-16" y="-23" width="32" height="46" rx="5" class="bezel"/>
          <rect x="-13" y="-20" width="26" height="20" rx="3" class="rk-top"/><rect x="-13" y="0" width="26" height="20" rx="3" class="rk-bot"/>
          <path d="M0,-17 C-4,-11 -6,-8.5 -6,-6.5 A6,6 0 0 0 6,-6.5 C6,-8.5 4,-11 0,-17 Z" class="ico"/>
        </g>
        <g id="f-sw-steam" class="rock lit-rk" role="button" tabindex="0" aria-pressed="false" aria-label="Steam switch" transform="translate(162 194)">
          <rect x="-16" y="-23" width="32" height="46" rx="5" class="bezel"/>
          <rect x="-13" y="-20" width="26" height="20" rx="3" class="rk-top"/><rect x="-13" y="0" width="26" height="20" rx="3" class="rk-bot"/>
          <path d="M-5,-3 C-8,-7 -2,-10 -5,-16 M0,-3 C-3,-7 3,-10 0,-16 M5,-3 C2,-7 8,-10 5,-16" class="ico"/>
        </g>
        <!-- power: a rocker in the center (a push button on the E), with its lights to the right -->
        <g id="f-sw-pwr" class="rock m-only" role="button" tabindex="0" aria-pressed="false" aria-label="Power switch" transform="translate(280 98)">
          <rect x="-18" y="-26" width="36" height="52" rx="6" class="bezel"/>
          <rect x="-15" y="-23" width="30" height="23" rx="3" class="rk-top"/><rect x="-15" y="0" width="30" height="23" rx="3" class="rk-bot"/>
          <path d="M0,-18 V-6" class="ico"/><circle cx="0" cy="11.5" r="5" class="ico"/>
        </g>
        <g id="f-pb-pwr" class="pbtn e-only" role="button" tabindex="0" aria-pressed="false" aria-label="Power button" transform="translate(280 98)">
          <circle r="19" class="bezel"/><circle r="15" class="pb-face"/>
          <path d="M-4.6,-3.5 A6,6 0 1 0 4.6,-3.5 M0,-7 V0.5" class="ico"/>
        </g>
        <g class="lamp bar-only" id="f-lp-bar" role="img" aria-label="Heating light, off"><rect x="310" y="76" width="9" height="44" rx="4.5" class="lp-bez"/><rect x="312" y="78" width="5" height="40" rx="2.5" class="lp"/><rect x="308" y="74" width="13" height="48" rx="6" class="lp-halo" filter="url(#sf-glow)"/></g>
        <g class="led-only">
          <g class="lamp grn" id="f-lp-pwr" role="img" aria-label="Power light, off"><circle cx="316" cy="86" r="7" class="lp-bez"/><circle cx="316" cy="86" r="4.6" class="lp"/><circle cx="316" cy="86" r="8" class="lp-halo" filter="url(#sf-glow)"/></g>
          <g class="lamp" id="f-lp-heat" role="img" aria-label="Heating light, off"><circle cx="316" cy="110" r="7" class="lp-bez"/><circle cx="316" cy="110" r="4.6" class="lp"/><circle cx="316" cy="110" r="8" class="lp-halo" filter="url(#sf-glow)"/></g>
        </g>

        <!-- group: a steel cylinder round it on the V1, a cone-shaped collar after -->
        <g class="v1-only"><rect x="242" y="210" width="76" height="40" rx="4" fill="url(#sf-steel)" class="edge"/><path d="M246,214 H314" class="ridge"/></g>
        <g class="v2p-only"><path d="M236,250 L248,214 H312 L324,250 Z" fill="url(#sf-steel)" class="edge"/></g>
        <line x1="242" y1="250" x2="318" y2="250" class="gasket"/>
        <g id="f-gflash"></g>

        <!-- steam wand: thin with a hex tip on the V1 and V2, thick on a ball joint from the V3 -->
        <g class="thin-only"><circle cx="404" cy="152" r="5" fill="url(#sf-steel)" class="edge"/><path d="M404,156 C404,200 392,226 389,258 L386,324" class="wand thin"/><path d="M382.5,322 h7 l1.5,4 v6 h-10 v-6 z" class="wandtip"/><rect id="f-wandmilk-thin" x="381" y="312" width="11" height="21" rx="3.5" class="wandmilk"/></g>
        <g class="thick-only"><circle cx="404" cy="152" r="8" fill="url(#sf-steel)" class="edge"/><path d="M404,160 C404,204 392,228 389,258 L386,322" class="wand"/><rect x="381.5" y="320" width="9" height="14" rx="3" class="wandtip"/><rect id="f-wandmilk" x="381" y="311" width="10" height="23" rx="3.5" class="wandmilk"/></g>

        <!-- steam knob, on the right side near the top: ribbed black, partly chrome from the V3 -->
        <rect x="440" y="110" width="9" height="16" rx="2" fill="url(#sf-steelh)" class="edge"/>
        <g id="f-knob" class="knobhit" role="button" tabindex="0" aria-pressed="false" aria-label="Steam knob" transform="translate(457 118)">
          <circle r="15" class="knob"/><circle r="11.5" class="knob-rib"/><circle r="7" class="knob-cap"/><g id="f-knobp"><line x1="0" y1="-12.5" x2="0" y2="-5" class="knob-ptr"/></g>
        </g>

        <!-- drip tray -->
        <g id="f-tray" role="button" tabindex="0" aria-label="Drip tray: empty it">
          <rect x="150" y="386" width="260" height="11" rx="2" fill="url(#sf-grate)" class="grate"/>
          <rect id="f-trayw" x="150" y="386" width="260" height="11" rx="2" class="trayw"/>
          <rect x="148" y="396" width="264" height="38" rx="4" fill="url(#sf-steel)" class="edge"/>
          <rect x="262" y="420" width="36" height="5" rx="2.5" class="pull"/>
        </g>
        <ellipse id="f-puddle" cx="280" cy="452" rx="0" ry="0" class="puddle"/>

        <!-- a coffee scale on the drip tray, under the cup -->
        <g id="f-scale">
          <rect x="242" y="377" width="76" height="9" rx="2.5" class="scl-body"/>
          <rect x="248" y="375" width="64" height="3" rx="1.5" class="scl-plate"/>
          <rect x="266" y="379" width="28" height="6" rx="1" class="scl-lcd"/>
          <text id="f-scale-g" x="292.5" y="384" class="scl-txt">0.0</text>
        </g>

        <g id="f-streams">
          <path id="f-gs1" class="fs water" d="M264,251 V390"/><path id="f-gs2" class="fs water" d="M280,251 V390"/><path id="f-gs3" class="fs water" d="M296,251 V390"/>
          <path id="f-ss1" class="fs" d="M272,286 V390"/><path id="f-ss2" class="fs" d="M288,286 V390"/>
          <path id="f-ws" class="fs water" d="M386,334 V390"/>
        </g>

        <!-- portafilter: ribbed black plastic on the V1 and V2, a commercial-style handle from the V3 -->
        <g id="f-pf" class="pfhit" role="button" tabindex="0" aria-label="Portafilter: take it out">
          <path d="M254,266 L184,306" class="pf-handle"/>
          <g class="thin-only"><path d="M236,276 l3,5 M224,283 l3,5 M212,290 l3,5 M200,297 l3,5" class="pf-rib"/></g>
          <g class="thick-only"><path d="M196,299 L180,308" class="pf-end"/></g>
          <path d="M254,266 L238,275" class="pf-neck"/>
          <path d="M246,251 H314 L308,274 H252 Z" fill="url(#sf-steel)" class="edge"/>
          <path d="M248,256 H312" class="pf-ear"/>
          <rect x="268" y="274" width="8" height="12" rx="2" class="spout"/><rect x="284" y="274" width="8" height="12" rx="2" class="spout"/>
          <path d="M246,250 H316 L310,290 H262 L196,316 L176,300 L246,262 Z" class="hit"/>
        </g>
        <g id="f-pfout">
          <g id="f-pfhandle" class="pfhit" role="button" tabindex="0" aria-label="Portafilter: lock it in"><path d="M64,432 L10,440" class="pf-handle"/><path d="M64,432 L56,433" class="pf-neck"/><rect x="2" y="424" width="60" height="24" class="hit"/></g>
          <g id="f-pfbasket" class="pfhit" role="button" tabindex="0" aria-label="Basket: knock out or fill">
            <path d="M62,432 Q62,446 92,446 Q122,446 122,432 Z" fill="url(#sf-steel)" class="edge"/>
            <ellipse cx="92" cy="432" rx="30" ry="8.5" fill="url(#sf-steelh)" class="edge"/>
            <ellipse cx="92" cy="432" rx="24.5" ry="6" class="pfc"/>
            <g id="f-pfgr"><ellipse cx="92" cy="431" rx="21" ry="4.2" class="grounds"/><ellipse cx="86" cy="430.5" rx="5" ry="1.2" class="grounds-hi"/></g>
            <g id="f-pfblind"><ellipse cx="92" cy="432" rx="24.5" ry="6" class="blindb"/><ellipse cx="92" cy="431.4" rx="10" ry="2.2" class="blindh"/></g>
            <rect x="60" y="420" width="64" height="28" class="hit"/>
          </g>
        </g>

        <!-- cup and milk jug -->
        <g id="f-cup" class="cuphit" role="button" tabindex="0" aria-label="Cup: move it">
          <ellipse cx="0" cy="0" rx="25" ry="3.6" class="saucer"/>
          <path d="M-18,-40 H18 L15,-5 Q14,-1 10,-1 H-10 Q-14,-1 -15,-5 Z" class="cupb"/>
          <path d="M17,-31 Q28,-31 28,-21 Q28,-13 15,-12" class="cuph"/>
          <g id="f-cupvap"><path d="M-6,-46 C-10,-54 -2,-58 -6,-66" class="vap"/><path d="M4,-46 C0,-54 8,-58 4,-66" class="vap"/></g>
          <rect x="-26" y="-44" width="58" height="49" class="hit"/>
        </g>
        <g id="f-jug" class="jughit" role="button" tabindex="0" aria-label="Milk jug: move it">
          <path d="M-24,-66 L-31,-74 H21 L25,-66 L24,-6 Q24,0 18,0 H-18 Q-24,0 -24,-6 Z" fill="url(#sf-steel)" class="edge"/>
          <path d="M24,-58 Q40,-56 40,-38 Q40,-22 24,-20" class="jugh"/>
          <g id="f-jugth"><line x1="10" y1="-92" x2="10" y2="-62" class="th-stem"/><circle cx="10" cy="-96" r="7" class="th-dial"/><line id="f-thn" x1="10" y1="-96" x2="10" y2="-101.5" class="th-n"/></g>
          <rect x="-32" y="-78" width="74" height="80" class="hit"/>
        </g>
        <g id="f-puffs"></g>
      </svg>
