<!-- %%FIG:ssr%% -->
<figure class="gfig" id="g-ssr">
  <svg viewBox="0 0 360 292" role="img" aria-label="Inside a solid-state relay. A small DC signal from the PCB lights an LED inside the relay; the light triggers a triac on the mains side, which switches the element. The two sides only meet through light, so the PCB stays isolated from mains. Below, the mains wave with the switched part highlighted: zero-cross relays turn on and off only where the wave crosses zero.">
    <rect x="44" y="40" width="244" height="110" rx="10" class="ssrbox"/>
    <text x="166" y="58" class="cap" text-anchor="middle">SSR</text>
    <line x1="166" y1="66" x2="166" y2="142" class="barrier"/>
    <text x="170" y="140" class="cap">isolation</text>
    <path d="M8,82 H96" class="lvw"/><path d="M8,118 H106 V104" class="lvw"/>
    <text x="8" y="28" class="cap">from J9: 5 V</text>
    <g class="ssrled"><polygon points="88,84 108,84 98,102" class="led"/><line x1="86" y1="104" x2="110" y2="104" class="ledbar"/></g>
    <path d="M116,88 l26,0 m-8,-5 l8,5 l-8,5 M116,100 l26,0 m-8,-5 l8,5 l-8,5" class="ray"/>
    <rect x="196" y="76" width="56" height="38" rx="6" class="triac"/><text x="224" y="100" class="cap" text-anchor="middle">triac</text>
    <path d="M352,22 H224 V76" class="hvw"/><path d="M224,114 V166 H352" class="hvw"/>
    <text x="352" y="14" class="cap" text-anchor="end">switched line in</text><text x="352" y="182" class="cap" text-anchor="end">to the element</text>
    <g transform="translate(12 230)">
      <path id="ssr-wave" class="sine" d=""/>
      <path id="ssr-on" class="sineon" d=""/>
      <path id="ssr-in" class="insig" d=""/>
      <text x="0" y="-36" class="cap">mains to the element</text><text x="0" y="58" class="cap">input</text>
    </g>
  </svg>
  <figcaption>The highlighted part of the wave is what reaches the element. It starts and stops only where the wave crosses zero.</figcaption>
</figure>

<!-- %%FIG:tc%% -->
<figure class="gfig" id="g-tc">

    <rect x="10" y="196" width="130" height="28" rx="6" class="brassbar"/><text x="75" y="244" class="cap" text-anchor="middle">boiler top</text>

    <path d="M74,180 C70,110 120,38 190,38 H236" class="tcw a"/><path d="M82,182 C90,124 130,70 190,70 H236" class="tcw b"/>
    <text x="120" y="28" class="cap">chromel (+)</text><text x="150" y="104" class="cap">alumel (−)</text>
    <rect x="236" y="24" width="30" height="60" rx="5" class="j4"/><text x="274" y="58" class="cap">J4</text>
    <path d="M251,84 V116" class="lvw"/>
    <rect x="200" y="116" width="150" height="46" rx="8" class="chip"/><text x="275" y="136" class="cap" text-anchor="middle">MAX31855</text><text x="275" y="152" class="cap" text-anchor="middle">on the PCB</text>
    <text x="176" y="190" class="cap">at the tip:</text><text x="176" y="212" class="big" id="tc-mv">2.8 mV</text>
