<!-- THERMOSTAT: bimetal and the swing it causes -->
<figure class="mini" id="mini-tstat">
  <svg viewBox="0 0 360 200" role="img" aria-label="Left, a bimetal thermostat: a bimetal disc under a pin and a pair of contacts. When the disc gets hot it bends upward, the pin lifts the contacts apart and the heater stops. Right, the boiler temperature rising and falling between where the thermostat opens and where it closes again.">
    <g class="tsx">
      <rect x="30" y="34" width="150" height="118" rx="10" class="housing"/>
      <rect x="24" y="152" width="162" height="12" rx="3" class="boilertop"/>
      <text x="105" y="184" class="cap" text-anchor="middle">boiler</text>
      <line x1="60" y1="58" x2="150" y2="58" class="term"/>
      <circle cx="132" cy="66" r="6" class="contact fixed"/>
      <g class="arm"><line x1="58" y1="80" x2="132" y2="80" class="armline"/><circle cx="132" cy="74" r="6" class="contact"/></g>
      <line x1="105" y1="84" x2="105" y2="128" class="pin"/>
      <path class="disc" d="M58,140 Q105,124 152,140"/>
      <text x="40" y="52" class="cap">contacts</text><text x="40" y="118" class="cap">bimetal</text>
    </g>
    <g transform="translate(196 0)">
      <rect x="0" y="22" width="160" height="140" rx="8" class="graph"/>
      <line x1="0" y1="58" x2="160" y2="58" class="limit"/><text x="156" y="52" class="cap" text-anchor="end">opens</text>
      <line x1="0" y1="96" x2="160" y2="96" class="limit"/><text x="156" y="112" class="cap" text-anchor="end">closes</text>
      <path class="trace" d=""/>
      <circle class="now" r="5" cx="0" cy="0"/>
      <text x="0" y="184" class="cap">temperature</text>
    </g>
  </svg>
  <figcaption>Simplified. The bimetal opens the contacts at one temperature and lets them close again several degrees cooler, which is why the temperature swings.</figcaption>
</figure>

<!-- SOLENOID VALVE: two states -->
<figure class="mini" id="mini-sol">
  <div class="mini-ctl"><button type="button" class="btn" data-sol aria-pressed="false">Brew switch off</button><span class="mini-note" data-sol-note>Off: the group is open to the drip tray.</span></div>
  <svg viewBox="0 0 360 214" role="img" aria-label="A 3-way solenoid valve with ports to the boiler, the group and the drip tray. Energized, the plunger lifts and water flows from the boiler to the group. Off, a spring pushes the plunger down, closing the boiler port and opening the group to the drip tray, which lets the pressure out of the puck.">
    <path d="M10,96 H100" class="pipe"/><path d="M180,150 V206" class="pipe"/><path d="M260,128 H350" class="pipe"/>
    <path d="M10,96 H100 L140,120 L172,150 V206" class="sflow feed"/>
    <path d="M180,206 V150 L210,128 H350" class="sflow vent"/>
    <rect x="90" y="78" width="170" height="80" rx="8" class="vbody"/>
    <rect x="122" y="16" width="106" height="64" rx="6" class="vcoil"/>
    <g class="vwind"><line x1="134" y1="18" x2="134" y2="78"/><line x1="148" y1="18" x2="148" y2="78"/><line x1="162" y1="18" x2="162" y2="78"/><line x1="188" y1="18" x2="188" y2="78"/><line x1="202" y1="18" x2="202" y2="78"/><line x1="216" y1="18" x2="216" y2="78"/></g>
    <g class="plunger"><rect x="165" y="40" width="20" height="70" rx="4"/><rect x="158" y="106" width="34" height="10" rx="3" class="seal"/></g>
    <text x="10" y="80" class="cap">from boiler</text><text x="192" y="204" class="cap">to group</text><text x="350" y="116" class="cap" text-anchor="end">to drip tray</text>
  </svg>
  <figcaption>Simplified. When the brew switch goes off, the valve dumps the pressure left in the group into the drip tray, so the portafilter comes off cleanly and the puck is drier.</figcaption>
</figure>

<!-- OPV: caps the pressure -->
<figure class="mini" id="mini-opv">
  <div class="mini-ctl"><label class="mini-note" for="opv-r">What the pump is pushing against</label><input type="range" id="opv-r" min="0" max="15" step="0.5" value="6"><output id="opv-o">6 bar</output></div>
  <svg viewBox="0 0 360 200" role="img" aria-label="A pipe from the pump to the boiler with a spring-loaded valve branching off it. Below the valve's setting the spring keeps it shut. Above it, the valve lifts and sends water back to the tank, so the pressure can't climb any higher.">
    <path d="M10,150 H350" class="pipe"/>
    <path d="M10,150 H350" class="sflow main"/>
    <path d="M196,124 V40 H344" class="pipe thin"/>
    <path d="M196,124 V40 H344" class="sflow ret"/>
    <rect x="168" y="96" width="56" height="52" rx="6" class="vbody"/>
    <g class="opvplug"><rect x="182" y="110" width="28" height="16" rx="3" class="seal"/><path d="M196,110 V70" class="stem"/></g>
    <path class="opvspring" d="M184,94 l24,-6 l-24,-6 l24,-6 l-24,-6 l24,-6 l-24,-6"/>
    <rect x="178" y="52" width="36" height="10" rx="2" class="nut"/>
    <text x="10" y="176" class="cap">from pump</text><text x="350" y="176" class="cap" text-anchor="end">to boiler</text><text x="344" y="30" class="cap" text-anchor="end">back to the tank</text>
    <g transform="translate(70 76)"><circle r="40" class="gauge"/><path d="M-30,18 A34,34 0 1,1 30,18" class="gscale"/><line class="needle" x1="0" y1="0" x2="0" y2="-30"/><text y="28" class="cap" text-anchor="middle" id="opv-g">6 bar</text></g>
  </svg>
  <figcaption>Illustrative setting of 11 bar. Above the setting the valve opens and the pressure stays put; turn the adjuster to move the setting.</figcaption>
</figure>
